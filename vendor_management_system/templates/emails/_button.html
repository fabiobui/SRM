{# Pulsante "bulletproof" (tabella + link), visibile anche su Outlook desktop. Parametri: url, label. #}
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0;">
  <tr>
    <td align="center" bgcolor="#218838" style="border-radius:6px; background-color:#218838;">
      <a href="{{ url }}" target="_blank" style="display:inline-block; padding:14px 28px; font-size:16px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:6px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 16px 0; font-size:12px; color:#6c757d; word-break:break-all;">
  Se il pulsante non funziona, copia e incolla questo indirizzo nel browser:<br>
  <a href="{{ url }}" style="color:#1a7a3a;">{{ url }}</a>
</p>
